<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking AI System</title>
    <!-- Thêm Bootstrap để giao diện đẹp và chuẩn responsive -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .ticket-box { 
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); 
            color: white; 
            border-radius: 12px; 
            padding: 25px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .highlight { color: #f1c40f; font-weight: bold; font-size: 1.1em; }
        .btn-checkin { background-color: #27ae60; border: none; padding: 12px; font-size: 1.1em; }
        .btn-checkin:hover { background-color: #2ecc71; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-5 text-primary fw-bold">🚗 TỔNG ĐÀI SMART PARKING AI 🚗</h2>
        
        <div class="row justify-content-center gap-4">
            <!-- Cột bên trái: Trạm Quẹt Thẻ -->
            <div class="col-md-5">
                <div class="card p-4">
                    <h4 class="mb-4 text-secondary border-bottom pb-2">📍 Trạm kiểm soát (Check-in)</h4>
                    <form id="checkinForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mã Sinh Viên</label>
                            <input type="text" class="form-control" id="student_id" value="SV2023_CNTT" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Thời gian quét thẻ</label>
                            <input type="datetime-local" class="form-control" id="entry_time" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Loại phương tiện</label>
                                <select class="form-select" id="vehicle">
                                    <option value="Motorbike">Xe máy</option>
                                    <option value="Car">Ô tô</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Khu vực hay đỗ</label>
                                <select class="form-select" id="usual_zone">
                                    <option value="Zone_A">Khu A</option>
                                    <option value="Zone_B">Khu B</option>
                                    <option value="Zone_C">Khu C</option>
                                    <option value="Zone_D">Khu D</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Lịch sử đỗ trung bình (phút)</label>
                            <input type="number" class="form-control" id="rolling_avg" value="260" required>
                        </div>
                        <button type="submit" class="btn btn-checkin text-white w-100 fw-bold shadow">
                            XÁC NHẬN VÀO BÃI
                        </button>
                    </form>
                </div>
            </div>

            <!-- Cột bên phải: Hiển thị Vé Xe & Dự đoán ML -->
            <div class="col-md-5">
                <div class="card p-4 h-100" id="resultCard" style="display: none;">
                    <h4 class="mb-4 text-success border-bottom pb-2">✅ Cấp thẻ thành công</h4>
                    <div class="ticket-box">
                        <h5 class="text-center mb-3 border-bottom border-light pb-2">VÉ XE ĐIỆN TỬ THÔNG MINH</h5>
                        <p class="mb-1">👤 Sinh viên: <span class="highlight" id="res_student"></span></p>
                        <p class="mb-3">📊 Hiện tại bãi đang có: <span class="highlight" id="res_demand"></span> chiếc xe</p>
                        
                        <div class="p-3 mt-3" style="background: rgba(255,255,255,0.1); border-radius: 8px;">
                            <p class="mb-2 text-warning fw-bold"><small>🧠 HỆ THỐNG AI ĐIỀU PHỐI:</small></p>
                            <p class="mb-1">▶ Dự đoán hành vi: <span class="highlight text-white" id="res_behavior"></span></p>
                            <p class="mb-1">▶ Giờ trả xe dự kiến: <span class="highlight text-white" id="res_exit"></span></p>
                            <p class="mb-0">▶ Khu vực đề xuất: <span class="highlight text-white" id="res_zone"></span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script gọi API Backend -->
    <script>
        // Set mặc định giờ hiện tại cho ô input
        document.getElementById('entry_time').value = new Date().toISOString().slice(0, 16);

        // Bắt sự kiện khi bấm nút XÁC NHẬN
        document.getElementById('checkinForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Ngăn trình duyệt reload trang
            
            // Lấy dữ liệu từ Form
            const payload = {
                student_id: document.getElementById('student_id').value,
                entry_time: document.getElementById('entry_time').value.replace('T', ' ') + ':00',
                vehicle: document.getElementById('vehicle').value,
                usual_zone: document.getElementById('usual_zone').value,
                rolling_avg: document.getElementById('rolling_avg').value,
                hist_overnight: 0
            };

            try {
                // Bắn API sang file app.py của Flask
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                // Nếu backend trả về thành công, cập nhật giao diện
                if(data.status === 'success') {
                    document.getElementById('res_student').innerText = data.student_id;
                    document.getElementById('res_demand').innerText = data.current_demand;
                    document.getElementById('res_behavior').innerText = data.behavior;
                    
                    const hours = Math.floor(data.duration_minutes / 60);
                    const mins = data.duration_minutes % 60;
                    document.getElementById('res_exit').innerText = data.estimated_exit + ` (Đỗ ~${hours}h${mins}m)`;
                    
                    document.getElementById('res_zone').innerText = data.recommended_zone;
                    
                    // Hiển thị cái vé xe lên
                    document.getElementById('resultCard').style.display = 'block';
                } else {
                    alert('Lỗi từ Server: ' + data.message);
                }
            } catch (error) {
                alert('Mất kết nối tới Hệ thống Máy chủ AI!');
            }
        });
    </script>
</body>
</html>
