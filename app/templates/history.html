<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử - Smart Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="nav-bar">
        <a href="/">Vào / Ra</a>
        <a href="/parking">Cổng camera</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/history">Lịch sử</a>
    </nav>
    <div class="page-wrap">
        <h1>Lịch sử ra vào</h1>
        <table class="data" id="histTable">
            <thead>
                <tr>
                    <th>ID</th><th>Biển vào</th><th>Biển ra</th><th>Khớp biển</th>
                    <th>Khớp loại</th><th>Quá giờ (phút)</th><th>Phạt (đ)</th><th>Trạng thái</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script>
        async function loadHistory() {
            const res = await fetch('/api/tickets');
            const data = await res.json();
            const tbody = document.querySelector('#histTable tbody');
            tbody.innerHTML = '';
            (data.tickets || []).forEach((t) => {
                const tr = document.createElement('tr');
                const plateOk = t.plate_match == null ? '—' : (t.plate_match ? 'Có' : 'Không');
                const vehOk = t.vehicle_match == null ? '—' : (t.vehicle_match ? 'Có' : 'Không');
                tr.innerHTML = `<td>${t.id}</td><td>${t.plate || ''}</td><td>${t.exit_plate || ''}</td>
                    <td>${plateOk}</td><td>${vehOk}</td><td>${t.overtime_minutes ?? ''}</td>
                    <td>${t.penalty_vnd ?? ''}</td><td>${t.status}</td>`;
                tbody.appendChild(tr);
            });
        }
        loadHistory();
    </script>
</body>
</html>
